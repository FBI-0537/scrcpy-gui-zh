name: Cleanup

# 删除指定的 Release 与标签。
# 用法：git push origin cleanup-v1.0.0
#   → 会删掉 v1.0.0 的 Release（含其资产）和 v1.0.0 这个标签
#
# 为什么存在：构建机的网络能访问 GitHub API，但助手所在的沙箱不能，
# 所以"撤销一次发布"这件事交给 CI 做。

on:
  push:
    tags: ["cleanup-*"]
  workflow_dispatch:
    inputs:
      target:
        description: "要删除的标签（例如 v1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  cleanup:
    name: 删除 Release 与标签
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 删除
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            target="${GITHUB_REF_NAME#cleanup-}"
          else
            target="${{ github.event.inputs.target }}"
          fi
          echo "本次要删除的目标：$target"
          echo

          mkdir -p /tmp/cl
          exec > >(tee /tmp/cl/delete.log) 2>&1
          if [ "$target" = "all" ]; then
            keep="${KEEP:-}"
            echo "=== 删除所有 Release（保留：${keep:-无}）==="
            ids="$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].id' 2>/dev/null || true)"
            for rid in $ids; do
              tag="$(gh api "repos/${{ github.repository }}/releases/$rid" --jq '.tag_name' 2>/dev/null || true)"
              [ -n "$tag" ] || continue
              case " $keep " in
                *" $tag "*) echo "  保留 $tag"; continue ;;
              esac
              echo "  删除 Release：$tag（id=$rid）"
              gh api -X DELETE "repos/${{ github.repository }}/releases/$rid" 2>&1 || echo "    （删除失败）"
            done
            echo
            echo "=== 删除所有标签 ==="
            refs="$(gh api "repos/${{ github.repository }}/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null || true)"
            for ref in $refs; do
              short="${ref#refs/}"
              echo "  删除标签：$ref"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/$short" 2>&1 || echo "    （删除失败）"
            done
            echo
            echo "=== 核对 ==="
            echo "剩余 Release："
            gh api "repos/${{ github.repository }}/releases" --jq '.[].tag_name' 2>&1 || true
            echo "剩余标签："
            gh api "repos/${{ github.repository }}/git/refs/tags" --jq '.[].ref' 2>&1 || true
            echo
            echo "全部清理完成"
            mkdir -p /tmp/cl
            {
              echo "target=all"
              echo "run=${{ github.run_number }}"
              echo "job_status=${{ job.status }}"
              echo "--- 剩余 Release ---"
              gh api "repos/${{ github.repository }}/releases" --jq '.[].tag_name' 2>&1 || true
              echo "--- 剩余标签 ---"
              gh api "repos/${{ github.repository }}/git/refs/tags" --jq '.[].ref' 2>&1 || true
            } > /tmp/cl/info.txt
            cd /tmp
            rm -rf cl-repo
            git clone --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cl-repo
            cd cl-repo
            mkdir -p cleaned
            cp /tmp/cl/info.txt "cleaned/all.txt"
            git checkout --orphan cleaned-all 2>/dev/null || true
            git rm -r --cached . >/dev/null 2>&1 || true
            git add -f cleaned
            git -c user.email=ci@users.noreply.github.com -c user.name=ci \
              commit -m "清理标记：all（run ${{ github.run_number }}）" || true
            git push -f origin "HEAD:cleaned-all"
            exit 0
          fi

          echo "=== ① 找到 Release ID ==="
          # 用 ID 删除，而不是 gh release delete <tag>：
          # 标签可能已经被删掉（实测踩过），而按标签找不到 Release 时删除会失败。
          rid="$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$target\") | .id" 2>&1 | head -1 || true)"
          echo "找到的 Release ID：${rid:-（没找到）}"
          echo

          echo "=== ② 删除 Release（含其资产）==="
          if [ -n "$rid" ] && printf '%s' "$rid" | grep -qE '^[0-9]+$'; then
            if gh api -X DELETE "repos/${{ github.repository }}/releases/$rid" 2>&1; then
              echo "已删除 Release（id=$rid）：$target"
            else
              echo "删除 Release 失败（id=$rid）"
            fi
          else
            echo "没有找到 $target 的 Release（可能已经删掉了）"
          fi
          echo

          echo "=== ③ 删除标签 ==="
          if gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$target" 2>&1; then
            echo "已删除标签：$target"
          else
            echo "删除标签失败（也可能本来就没有）"
          fi
          echo

          echo "=== ④ 核对：该 Release 是否还在 ==="
          still="$(gh api "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.tag_name == \"$target\") | .tag_name" 2>/dev/null || true)"
          if [ -n "$still" ]; then
            echo "❌ 仍然存在：$still —— 删除没成功"
          else
            echo "✅ 已确认 $target 的 Release 不存在了"
          fi
          echo
          if [ -n "$still" ]; then
            exit 1
          fi

          echo "=== 剩余 Release 列表 ==="
          gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | "\(.tag_name)\t\(.assets | length) 个资产"' 2>&1 \
            || echo "（列 Release 失败）"
          echo
          echo "=== 剩余标签列表 ==="
          git ls-remote --tags "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" 2>/dev/null \
            | sed 's|.*refs/tags/||' | grep -v '\^{}' | sort -u || true

      - name: 把结果写进标记分支（便于核对）
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            target="${GITHUB_REF_NAME#cleanup-}"
          else
            target="${{ github.event.inputs.target }}"
          fi
          mkdir -p /tmp/cl
          {
            echo "target=$target"
            echo "run=${{ github.run_number }}"
            echo "job_status=${{ job.status }}"
            echo "--- 删除日志（末尾 40 行）---"
            tail -40 /tmp/cl/delete.log 2>/dev/null || echo "(没有日志)"
            echo "--- 剩余 Release ---"
            gh api "repos/${{ github.repository }}/releases" \
              --jq '.[] | "\(.tag_name)\t\(.assets | length) 个资产"' 2>&1 \
              || echo "(查询失败)"
            echo "--- 剩余标签 ---"
            git ls-remote --tags "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" 2>/dev/null \
              | sed 's|.*refs/tags/||' | grep -v '\^{}' | sort -u || echo "(查询失败)"
          } > /tmp/cl/info.txt
          cd /tmp
          rm -rf cl-repo
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cl-repo
          cd cl-repo
          mkdir -p cleaned
          cp /tmp/cl/info.txt "cleaned/$target.txt"
          git checkout --orphan "cleaned-$target" 2>/dev/null || true
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f cleaned
          git -c user.email=ci@users.noreply.github.com -c user.name=ci \
            commit -m "清理标记：$target（run ${{ github.run_number }}）" || true
          git push -f origin "HEAD:cleaned-$target"
