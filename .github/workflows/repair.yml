name: Repair Release

# 把最近一次成功构建的产物补传到 Release。
#   git push origin repair-v1.0.0
# 用途：Release 被误删 / publish 失败时，不必重跑整条 1 小时的流水线。

on:
  push:
    tags: ["repair-*"]
  workflow_dispatch:
    inputs:
      target:
        description: "要补传的标签（例如 v1.0.0）"
        required: true

permissions:
  contents: write
  actions: read        # gh run list / gh run download 需要它（只写 contents 时其它 scope 默认 none）

jobs:
  repair:
    name: 补传产物到 Release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # gh 在没有 actions/checkout 的 job 里无法推断仓库（实测报
      # "not a git repository"），必须显式给。
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 确定目标标签
        id: t
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            t="${GITHUB_REF_NAME#repair-}"
          else
            t="${{ github.event.inputs.target }}"
          fi
          echo "target=$t" >> "$GITHUB_OUTPUT"
          echo "目标标签：$t"

      - name: 找最近一次成功的 Release 运行
        id: find
        run: |
          set -e
          mkdir -p /tmp/rep
          exec > >(tee /tmp/rep/find.log) 2>&1
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-（空）}"
          echo "GH_HOST=${GH_HOST:-（空）} GH_REPO=${GH_REPO:-（空）}"
          echo "gh 版本：$(gh --version 2>&1 | head -1)"
          echo
          # 方式一：按工作流文件名查（不吞 stderr，出错要看得见）
          echo "--- 方式一：gh run list --workflow=release.yml ---"
          rid="$(gh run list --workflow=release.yml --status=success --limit 1 \
            --json databaseId --jq '.[0].databaseId' 2>&1 || true)"
          echo "$rid"
          case "$rid" in
            ''|*[!0-9]*) rid="" ;;
          esac
          # 方式二（兜底）：列出最近的成功运行，按 workflowName 过滤
          if [ -z "$rid" ]; then
            echo "--- 方式二：列出成功运行并按名字过滤 ---"
            rid="$(gh run list --status=success --limit 30 \
              --json databaseId,workflowName,name \
              --jq '[.[] | select((.workflowName // "") == "Release" or (.name // "") | startswith("Release"))][0].databaseId' 2>&1 || true)"
            echo "$rid"
            case "$rid" in
              ''|*[!0-9]*) rid="" ;;
            esac
          fi
          # 方式三（再兜底）：不筛状态，取最近一次有 artifact 的运行
          if [ -z "$rid" ]; then
            echo "--- 方式三：最近 20 次运行里挑一个 ---"
            gh run list --limit 20 --json databaseId,workflowName,conclusion 2>&1 | sed -n '1,40p' || true
          fi
          # 方式四（最兜底）：直接用 API 列运行（显式带仓库路径）
          if [ -z "$rid" ]; then
            echo "--- 方式四：gh api 直接列运行 ---"
            rid="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30&status=success" \
              --jq '.workflow_runs[] | select(.name | startswith("Release")) | .id' 2>&1 | head -1 || true)"
            echo "$rid"
            case "$rid" in
              ''|*[!0-9]*) rid="" ;;
            esac
          fi
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "最终采用的 run_id：${rid:-（没找到）}"
          [ -n "$rid" ] || { echo "没有找到可用于补传的运行"; exit 1; }

      - name: 下载那次运行的全部 artifact
        run: |
          rm -rf dl assets
          mkdir -p dl assets
          gh run download "${{ steps.find.outputs.run_id }}" -D dl
          echo "=== 下载到的内容（前 30 项）==="
          find dl -maxdepth 3 | sed -n '1,30p'

      - name: 只挑文件，重建校验和
        run: |
          set -e
          n=0
          while IFS= read -r f; do
            cp "$f" assets/
            n=$((n + 1))
          done < <(find dl -type f \( -name '*.tar.xz' -o -name '*.tar.gz' \
                    -o -name '*.txt' -o -name '*.exe' \) ! -name 'SHA256SUMS.txt' | sort)
          echo "挑出 $n 个文件："
          ls -lh assets
          cd assets
          : > SHA256SUMS.txt
          for f in *.tar.xz *.tar.gz *.txt *.exe; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> SHA256SUMS.txt
          done
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          [ -s SHA256SUMS.txt ] || { echo "校验和为空，失败"; exit 1; }

      - name: 创建或更新 Release 并上传
        run: |
          set -e
          t="${{ steps.t.outputs.target }}"
          if gh release view "$t" >/dev/null 2>&1; then
            echo "Release 已存在：$t"
          else
            echo "创建 Release：$t"
            gh release create "$t" --title "$t" \
              --notes "由补传工作流生成（原运行的发布步骤未完成）。产物与构建产物一致。"
          fi
          for f in assets/*; do
            [ -f "$f" ] || continue
            echo "--- 上传 $(basename "$f")"
            gh release upload "$t" "$f" --clobber
          done
          echo
          echo "=== Release 上实际的资产 ==="
          gh release view "$t" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"' | tee /tmp/repair-assets.txt
          echo "资产数：$(grep -c . /tmp/repair-assets.txt || echo 0)"

      - name: 把结果写进标记分支
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          t="${{ steps.t.outputs.target }}"
          mkdir -p /tmp/rep
          {
            echo "target=$t"
            echo "run=${{ github.run_number }}"
            echo "job_status=${{ job.status }}"
            echo "source_run=${{ steps.find.outputs.run_id }}"
            echo "--- 查找步骤的输出 ---"
            cat /tmp/rep/find.log 2>/dev/null | sed -n '1,60p' || echo "(没有 find.log)"
            echo "--- Release 资产 ---"
            cat /tmp/repair-assets.txt 2>/dev/null || echo "(没有清单)"
          } > /tmp/rep/info.txt
          cd /tmp
          rm -rf rep-repo
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rep-repo
          cd rep-repo
          mkdir -p repaired
          cp /tmp/rep/info.txt "repaired/$t.txt"
          git checkout --orphan "repaired-$t" 2>/dev/null || true
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f repaired
          git -c user.email=ci@users.noreply.github.com -c user.name=ci \
            commit -m "补传标记：$t（run ${{ github.run_number }}）" || true
          git push -f origin "HEAD:repaired-$t"
